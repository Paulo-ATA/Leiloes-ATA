name: Agendamento Diário - Raspador de Leilões Araçatuba

on:
  schedule:
    # Roda diariamente às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * *'
  # Permite disparar manualmente pela aba Actions do GitHub
  workflow_dispatch:

jobs:
  executar-raspagem:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 psycopg2-binary

      - name: Executar raspador e atualizar Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scraper_aracatuba.py
